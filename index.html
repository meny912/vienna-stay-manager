<title>Vienna Stay — Manager</title>
<style>
:root{
  --brand:#8a7d6b;--brand-dark:#6d6153;--brand-darker:#554c41;

}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--cream);line-height:1.5}

.container{max-width:1080px;margin:0 auto;padding:0 20px}
.site-header{background:var(--brand);color:#fff}
.site-header .container{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer}

.nav a{color:#fff;text-decoration:none;margin-left:22px;font-size:15px;opacity:.92;cursor:pointer}

.chat-fab{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:24px;cursor:pointer;box-shadow:0 6px 20px rgba(70,60,48,.28);z-index:300;user-select:none}

.chat-panel{position:fixed;right:20px;bottom:88px;width:350px;max-width:calc(100vw - 40px);height:480px;max-height:calc(100vh - 120px);background:#fff;border:1px solid var(--beige-line);border-radius:16px;box-shadow:0 14px 44px rgba(70,60,48,.28);display:flex;flex-direction:column;overflow:hidden;z-index:300}

.cmsg{max-width:84%;padding:9px 12px;border-radius:13px;font-size:14px;line-height:1.45}
.cmsg.bot{background:#fff;border:1px solid var(--beige-line);align-self:flex-start;border-bottom-left-radius:3px}
.cmsg.user{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}

.chat-sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}

.chat-input{display:flex;gap:6px;padding:10px;border-top:1px solid var(--beige-line);background:#fff}
.chat-input input{flex:1;border:1px solid var(--beige-line);border-radius:10px;padding:9px 12px;font-size:14px;background:var(--cream);color:var(--ink)}
.chat-input button{background:var(--brand);color:#fff;border:none;border-radius:10px;width:42px;cursor:pointer;font-size:16px}
.typing{display:inline-flex;gap:4px;padding:3px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;animation:tdot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:#fff;border:none;padding:12px 22px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--brand-dark)}
.btn:disabled{background:#c9c2b6;cursor:not-allowed}
.btn-sm{padding:7px 14px;font-size:13px}

.btn-ghost:hover{background:var(--beige)}
.btn-danger{background:var(--danger)}.btn-danger:hover{background:var(--danger-dark)}
.btn-block{width:100%}
.card{background:#fff;border:1px solid var(--beige-line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.locmap{width:100%;display:block;height:480px;max-height:70vh;border-radius:12px;border:1px solid var(--beige-line);overflow:hidden;z-index:0}
.leaflet-popup-content{font-family:-apple-system,sans-serif;font-size:13px}
.hero{background:linear-gradient(rgba(85,76,65,.55),rgba(85,76,65,.55)),url('https://images.unsplash.com/photo-1467269204594-9661b134dd2b?auto=format&fit=crop&w=1600&q=70');background-size:cover;background-position:center;color:#fff;padding:72px 0 84px}
.hero h1{font-size:44px;margin:0 0 10px}.hero p{font-size:18px;opacity:.95;margin:0}
.searchbox{background:#fff;color:var(--ink);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-top:28px;display:grid;grid-template-columns:1fr 1fr .7fr auto;gap:14px;align-items:end}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.field input{width:100%;padding:11px 12px;border:1px solid var(--beige-line);border-radius:9px;font-size:15px;background:var(--cream);color:var(--ink)}
.datebox{width:100%;padding:11px 12px;border:1px solid var(--beige-line);border-radius:9px;font-size:15px;background:var(--cream);color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center}

.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;font-family:Georgia,serif;color:var(--ink)}

.cd:hover:not(.dis):not(.empty){background:var(--beige)}
.cd.sel{background:var(--brand);color:#fff;font-weight:700}
.cd.dis{color:#cfc7ba;cursor:default}

.nights-pill{background:var(--beige);border-radius:8px;padding:6px 12px;font-size:14px;color:var(--brand-dark);display:inline-block;margin-top:10px}

.section{padding:40px 0}.section h2{font-size:28px;margin:0 0 6px}.section .sub{color:var(--muted);margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.unit-card img{width:100%;height:190px;object-fit:cover;display:block}
.unit-card .body{padding:16px}.unit-card h3{margin:0 0 6px;font-size:20px}
.unit-card .desc{color:var(--muted);font-size:14px;margin:0 0 14px;min-height:40px}
.price-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.price-row .per{color:var(--muted);font-size:13px}.price-row .total{font-weight:700;font-size:17px}
.combo-badge{display:inline-block;background:var(--teal);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;margin-bottom:8px}
.combo-imgs{display:flex}.combo-imgs img{width:50%;height:150px;object-fit:cover}
.chip{display:inline-block;background:var(--beige);color:var(--brand-dark);border-radius:999px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0}
.summary-bar{background:var(--beige);border:1px solid var(--beige-line);border-radius:10px;padding:12px 16px;margin:22px 0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start}
.pad{padding:22px}.gallery{width:100%;height:340px;object-fit:cover;border-radius:12px}
.muted{color:var(--muted)}.stack>*+*{margin-top:12px}.divider{height:1px;background:var(--beige-line);margin:16px 0}
.timer{display:inline-flex;align-items:center;gap:8px;background:var(--beige);border:1px solid var(--beige-line);color:var(--brand-dark);border-radius:999px;padding:8px 16px;font-weight:600;font-size:15px}
.timer.warn{background:#f7e3d6;border-color:#eac3ab;color:var(--danger-dark)}
.timer.expired{background:#f3d2c6}
.breakdown{font-size:15px}.breakdown .line{display:flex;justify-content:space-between;padding:5px 0}
.breakdown .discount{color:var(--ok)}
.breakdown .grand{border-top:1px solid var(--beige-line);margin-top:8px;padding-top:10px;font-weight:700;font-size:18px}
.promo-row{display:flex;gap:8px}
.promo-row input{flex:1;padding:10px 12px;border:1px solid var(--beige-line);border-radius:9px;background:var(--cream)}
.inline-error{color:var(--danger);font-size:13px;margin-top:6px}.inline-ok{color:var(--ok);font-size:13px;margin-top:6px}
.park-opt{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;color:var(--ink);background:var(--cream);border:1px solid var(--beige-line);border-radius:9px;padding:10px 12px}
.park-opt input{width:17px;height:17px;cursor:pointer}
textarea.ctrl{width:100%;padding:11px 12px;border:1px solid var(--beige-line);border-radius:9px;font-size:14px;background:var(--cream);color:var(--ink);font-family:inherit;resize:vertical}
.email-edit{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:14px}
.email-prev{border:1px solid var(--beige-line);border-radius:10px;padding:14px;margin-top:8px;background:#fff}
.email-subj{font-weight:700;margin-bottom:8px;font-family:Georgia,serif}
.email-body{white-space:pre-wrap;font-size:14px;line-height:1.5}
@media(max-width:900px){.email-edit{grid-template-columns:1fr}}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge.confirmed{background:#e2efe3;color:var(--ok)}.badge.cancelled{background:#f3d9cf;color:var(--danger-dark)}
.badge.soft_locked{background:#efe7d6;color:#8a6d1f}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}.empty .icon{font-size:46px;margin-bottom:10px}
.aptgroup td{background:var(--cream);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:7px 10px}
.ctrl.needs{border-color:#c9873a;background:#fdf6ee}
.ph{width:100%;height:190px;display:grid;place-items:center;background:linear-gradient(135deg,#8a7d6b,#554c41);color:#fff;font-family:Georgia,serif;font-size:20px;letter-spacing:1px;text-align:center;padding:14px}
.ph span{opacity:.92}
.ph.gallery{height:340px;border-radius:12px;font-size:27px}
.bldg{font-family:Georgia,serif;font-size:19px;margin:26px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--beige-line)}
.onreq{margin-top:44px;padding-top:8px}
.notice{background:#f7e3d6;border:1px solid #eac3ab;color:var(--danger-dark);border-radius:10px;padding:14px 16px;font-size:14px}
.site-footer{background:var(--brand-darker);color:#e9e2d8;margin-top:50px;padding:26px 0;font-size:14px}
.site-footer .container{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.site-footer a{color:#fff;cursor:pointer;text-decoration:underline} .ig-link{display:inline-flex;align-items:center;gap:7px;text-decoration:none!important;color:#fff}.ig-link:hover{opacity:.8}.ig-link svg{width:19px;height:19px;flex:none}.nav .ig-link{color:#fff}.nav .ig-link svg{width:20px;height:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-grid .full{grid-column:1/-1}
input.ctrl,select.ctrl{width:100%;padding:11px 12px;border:1px solid var(--beige-line);border-radius:9px;font-size:15px;background:var(--cream);color:var(--ink)}
label.lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
/* ADMIN */
.admin-top{background:var(--brand-darker);color:#fff;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.admin-top .brand{display:flex;align-items:center;gap:10px;font-family:Georgia,serif;letter-spacing:1px}
.admin-top a{color:#e9e2d8;cursor:pointer;text-decoration:none;font-size:14px;margin-left:18px}
.admin-top a:hover{color:#fff;text-decoration:underline}
.admin-layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 56px)}
.admin-side{background:#fff;border-right:1px solid var(--beige-line);padding:16px 12px}
.admin-side .grp{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:16px 8px 6px}
.admin-side a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:14px}
.admin-side a:hover{background:var(--cream)}
.admin-side a.active{background:var(--beige);color:var(--brand-dark);font-weight:700}
.admin-side a.disabled{color:#b9b1a4;cursor:default}
.admin-main{padding:26px;background:var(--cream)}
.admin-main h1{font-size:26px;margin:0 0 2px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}
.kpi{background:#fff;border:1px solid var(--beige-line);border-radius:12px;padding:16px}
.kpi .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
.kpi .big{font-size:26px;font-weight:700;margin-top:8px;font-family:Georgia,serif}
.kpi .sub{font-size:13px;color:var(--muted);margin-top:2px}
.tag{background:var(--teal);color:#fff;font-size:11px;padding:2px 8px;border-radius:999px}
.panel{background:#fff;border:1px solid var(--beige-line);border-radius:12px;padding:18px;margin-top:16px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--beige-line);white-space:nowrap}
.tbl th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.tbl tr:hover td{background:var(--cream)}
.bars{display:flex;align-items:flex-end;gap:5px;height:120px;margin-top:10px}
.bar{flex:1;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters .f{padding:6px 12px;border-radius:999px;border:1px solid var(--beige-line);background:#fff;cursor:pointer;font-size:13px}
.filters .f.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.cal{overflow-x:auto}
.cal table{border-collapse:collapse;font-size:12px}
.cal th,.cal td{border:1px solid var(--beige-line);padding:0;text-align:center;min-width:34px;height:34px}
.cal th.unit,.cal td.unit{text-align:left;padding:6px 10px;min-width:150px;white-space:nowrap;font-weight:600}
.cal .booked{background:var(--brand);color:#fff}
.cal .today{outline:2px solid var(--teal);outline-offset:-2px}

.cal{overflow:auto;max-height:calc(100vh - 250px)}
.pl thead th{position:sticky;top:0;z-index:3;background:#fff}
.pl thead th.pl-unit{z-index:4}
.pl td.free{cursor:pointer;background:#f2f8f2;border:1px solid #fff}
.pl tr.pl-group td{background:var(--brand-darker);color:#fff;padding:5px 10px;font-size:12px;letter-spacing:.4px;text-transform:uppercase;position:sticky;left:0}
.pl td.pl-grouphead{background:var(--brand-darker);color:#fff;font-weight:700;z-index:3}
.pl td.free:hover{background:#cfe8cf}
.pl td.free.pl-today{background:#d8efd8}
.pl-inner{cursor:pointer}
.pl-inner:hover{filter:brightness(1.15)}
.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:16px 0 6px}
.ops .k{background:#fff;border:1px solid var(--beige-line);border-radius:11px;padding:14px 16px}
.ops .k .n{font-size:29px;font-weight:700;line-height:1.05}
.ops .k .l{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:5px}
.ops .k .p{font-size:12.5px;color:var(--muted);margin-top:3px}
.ops .k.go .n{color:#8a5a2b} .ops .k.in .n{color:#2f6b4f} .ops .k.st .n{color:#35568a} .ops .k.cl .n{color:#7a3f8a}
.oplist{margin-top:22px}
.oplist h3{font-family:Georgia,serif;font-size:17px;margin:0 0 8px}
.oplist .none{color:var(--muted);font-size:14px;padding:10px 0}
.fwd td.z{color:var(--beige-line)}
.calbar{display:flex;align-items:center;gap:10px;margin:14px 0}
.calbar select{padding:7px 10px;border:1px solid var(--beige-line);border-radius:8px;font-size:14px;background:#fff}
.calbar button{padding:7px 13px;border:1px solid var(--beige-line);background:#fff;border-radius:8px;cursor:pointer;font-size:15px}
.calbar button:hover{background:var(--cream)}
.ovl{position:fixed;inset:0;background:rgba(40,35,30,.5);display:grid;place-items:center;z-index:50;padding:18px}
.ovl-card{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.ovl-card h3{margin:0 0 4px}
.ovl-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.ovl-row .full{grid-column:1/-1}
.ovl-act{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.ovl-err{background:#f7e3d6;border:1px solid #eac3ab;color:var(--danger-dark);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:12px}
.pl th.plday .n{font-weight:700;font-size:14px}.pl th.plday .m{font-size:10px;color:var(--muted)}.pl th.plday .w{font-size:10px;color:var(--muted)}
.pl .pl-today{background:#e6f5e6}
.pl td.pl-book{padding:0;text-align:left}

</head>
<body>
<div id="root"></div>
<script>
const CUR='€';
const PARK_PRICE=15;
const UNITS=[

const D=s=>new Date(s+'T00:00:00');
const nights=(a,b)=>Math.round((D(b)-D(a))/86400000);
const overlap=(ai,ao,bi,bo)=>D(ai)<D(bo)&&D(ao)>D(bi);
const iso=off=>{const d=new Date();d.setDate(d.getDate()+off);return d.toISOString().slice(0,10)};
const TODAY=iso(0);
const fmt=s=>s?D(s).toLocaleDateString(LOCALE(),{day:'numeric',month:'short',year:'numeric'}):'';

const getUnit=id=>UNITS.find(u=>u.id===id);
function nightly(u,day){for(const r of SEASONAL){if(r.unitId===u.id&&D(day)>=D(r.from)&&D(day)<=D(r.to))return r.price}return u.basePricePerNight}
function priceForStay(u,ci,co){let t=0,c=D(ci),e=D(co);while(c<e){t+=nightly(u,c.toISOString().slice(0,10));c.setDate(c.getDate()+1)}return t}
function comboPrice(ids,ci,co){return ids.reduce((s,id)=>s+priceForStay(getUnit(id),ci,co),0)}
function validateDiscount(codeStr,n,sub){const code=(codeStr||'').trim().toUpperCase();if(!code)return{ok:false,reason:L('Enter a code.','Bitte Code eingeben.')};const dc=CODES.find(c=>c.code===code);if(!dc||dc.active===false)return{ok:false,reason:L('This code is not valid.','Dieser Code ist ungültig.')};const now=new Date();if(now<D(dc.from)||now>D(dc.to))return{ok:false,reason:L('This code has expired.','Dieser Code ist abgelaufen.')};if(n<dc.minNights)return{ok:false,reason:L('This code needs at least '+dc.minNights+' nights.','Dieser Code erfordert mindestens '+dc.minNights+' Nächte.')};const amount=dc.type==='percent'?Math.round(sub*dc.value/100):Math.min(dc.value,sub);return{ok:true,code:dc.code,amount,label:dc.type==='percent'?dc.value+'%'+L(' off',' Rabatt'):CUR+dc.value+L(' off',' Rabatt')}}

const KEY='vienna-stay-bookings-v2';

const makeRef=()=>'VS-'+Math.random().toString(36).slice(2,7).toUpperCase();
const blocks=b=>b.status==='confirmed'||b.status==='awaiting_payment'||(b.status==='soft_locked'&&new Date(b.lockExpiresAt)>new Date());
const unitBusy=(uid,ci,co,ex)=>bookings.some(b=>b.id!==ex&&blocks(b)&&b.unitIds.includes(uid)&&overlap(ci,co,b.checkIn,b.checkOut));
/* A unit with no rate or no capacity is not sellable yet: it is shown to guests,
   but on request only — never priced at zero. */
const isBookable=u=>u.kind!=='garage'&&u.maxGuests>0&&u.basePricePerNight>0;
const unitsFree=(ci,co)=>UNITS.filter(u=>u.kind!=='garage'&&!unitBusy(u.id,ci,co));
const availableUnits=(ci,co)=>unitsFree(ci,co).filter(isBookable);
const onRequestUnits=(ci,co)=>unitsFree(ci,co).filter(u=>!isBookable(u));
/* Group anything by building, keeping the owner's own order. */
function byBuilding(list){const m=new Map();list.forEach(function(u){const k=u.location||'Vienna';if(!m.has(k))m.set(k,[]);m.get(k).push(u)});return [...m.entries()]}
function unitImg(u,cls){return u.photo?`<img src="${u.photo}" alt="" class="${cls||''}">`:`<div class="ph ${cls||''}"><span>${esc((u.name||'').split('|').pop().trim())}</span></div>`}
function buildOptions(ci,co,guests){
 const avail=availableUnits(ci,co);
 const singles=avail.filter(u=>u.maxGuests>=guests).sort((a,b)=>priceForStay(a,ci,co)-priceForStay(b,ci,co));
 if(singles.length)return singles.map(u=>({type:'single',unitIds:[u.id],units:[u],capacity:u.maxGuests,total:priceForStay(u,ci,co)}));
 const sorted=[...avail].sort((a,b)=>b.maxGuests-a.maxGuests);
 const chosen=[];let cap=0;
 for(const u of sorted){chosen.push(u);cap+=u.maxGuests;if(cap>=guests)break}
 if(cap>=guests)return[{type:'combo',unitIds:chosen.map(u=>u.id),units:chosen,capacity:cap,total:chosen.reduce((s,u)=>s+priceForStay(u,ci,co),0)}];
 return[];
}

/* ===== THE OPERATING DAY =====
   Mirrors how a working PMS frames it: a unit that is emptied AND a unit that
   is still occupied both need housekeeping, so "to clean" is departures plus
   stayers — not just turnovers. */
function opsFor(day){
 const live=bookings.filter(b=>b.status==='confirmed'||b.status==='awaiting_payment');
 const out=live.filter(b=>b.checkOut===day);
 const inn=live.filter(b=>b.checkIn===day);
 const stay=live.filter(b=>D(b.checkIn)<D(day)&&D(b.checkOut)>D(day));
 const pax=a=>a.reduce((s,b)=>s+(Number(b.guests)||0),0);
 const units=a=>a.reduce((s,b)=>s+b.unitIds.length,0);
 return {out:out,inn:inn,stay:stay,
         nOut:units(out),pOut:pax(out),nIn:units(inn),pIn:pax(inn),
         nStay:units(stay),pStay:pax(stay),
         nClean:units(out)+units(stay),pClean:pax(out)+pax(stay)};
}
function opsRow(b,which){
 const u=b.unitIds.map(id=>{const x=getUnit(id);return x?x.name:id}).join(' + ');
 const loc=(()=>{const x=getUnit(b.unitIds[0]);return x&&x.location?x.location:''})();

/* ===== BOOKING EDITOR (manager) ===== */
const SOURCES=['DIRECT','PHONE','WALK-IN','WHATSAPP','BOOKING.COM','AIRBNB','OTHER'];
function mgrNew(unitId,day){
 const out=D(day);out.setDate(out.getDate()+2);
 state.mgr={mode:'new',id:null,unitId:unitId,checkIn:day,checkOut:out.toISOString().slice(0,10),
            guests:2,name:'',email:'',phone:'',source:'PHONE',status:'confirmed',total:'',ref:''};
 state.mgrErr='';render();mgrQuote();
}
function mgrOpen(id){
 const b=bookings.find(x=>x.id===id);if(!b)return;
 state.mgr={mode:'edit',id:b.id,unitId:b.unitIds[0],checkIn:b.checkIn,checkOut:b.checkOut,
            guests:b.guests,name:b.guestName||'',email:b.guestEmail||'',phone:b.guestPhone||'',
            source:b.source||'DIRECT',status:b.status,total:b.total,ref:b.ref};
 state.mgrErr='';render();
}
function mgrClose(){state.mgr=null;state.mgrErr='';render()}
function mgrSet(k,v){state.mgr[k]=v;if(k==='checkIn'||k==='checkOut'||k==='unitId'){render();mgrQuote()}}
/* Ask the server what this stay costs, so manual bookings use the same price list. */
async function mgrQuote(){
 const m=state.mgr;if(!m||nights(m.checkIn,m.checkOut)<1)return;
 const r=await sbRpc('vs_price_stay',{p_units:[m.unitId],p_ci:m.checkIn,p_co:m.checkOut});
 if(state.mgr&&typeof r==='number'){state.mgr.total=r;render()}
}
async function mgrSave(){
 const m=state.mgr;state.mgrErr='';
 const n=nights(m.checkIn,m.checkOut);
 if(n<1){state.mgrErr='Check-out must be after check-in.';render();return}
 if(!m.name.trim()){state.mgrErr='Please enter the guest name.';render();return}
 state.mgrBusy=true;render();
 const busy=await sbRpc('vs_units_busy',{p_units:[m.unitId],p_ci:m.checkIn,p_co:m.checkOut,p_exclude:m.id});
 if(busy===true){state.mgrBusy=false;state.mgrErr='That apartment is already taken for these dates.';render();return}
 const row={unit_ids:[m.unitId],check_in:m.checkIn,check_out:m.checkOut,nights:n,guests:Number(m.guests)||1,
            subtotal:Number(m.total)||0,discount_amount:0,extras_total:0,total:Number(m.total)||0,
            guest_name:m.name.trim(),guest_email:m.email.trim()||null,guest_phone:m.phone.trim()||null,
            source:m.source,status:m.status};
 if(m.mode==='new'){
  row.id='b'+Date.now();row.ref=makeRef();row.created_at=new Date().toISOString();
  row.extras=[];row.lock_expires_at=null;
  if(m.status==='confirmed')row.paid_at=new Date().toISOString();
  await sbInsert('bookings',row);
 }else{
  await sbPatch('bookings','id',m.id,row);
 }
 state.mgrBusy=false;state.mgr=null;
 await reloadBookings();render();
}
async function mgrCancel(){
 const m=state.mgr;
 if(!confirm('Cancel this booking? The apartment becomes free again.'))return;
 state.mgrBusy=true;render();
 await sbPatch('bookings','id',m.id,{status:'cancelled',cancelled_at:new Date().toISOString()});
 state.mgrBusy=false;state.mgr=null;await reloadBookings();render();
}
function mgrModal(){
 const m=state.mgr;if(!m)return '';

 const srcs=SOURCES.map(s=>`<option value="${s}"${s===m.source?' selected':''}>${s}</option>`).join('');
 const sts=['confirmed','soft_locked','cancelled'].map(s=>`<option value="${s}"${s===m.status?' selected':''}>${s==='soft_locked'?'option / hold':s}</option>`).join('');
 return `<div class="ovl" onclick="if(event.target===this)mgrClose()"><div class="ovl-card">
  <h3>${m.mode==='new'?'New booking':'Booking '+esc(m.ref)}</h3>
  <p class="muted" style="margin:0 0 6px;font-size:13px">${m.mode==='new'?'For a booking that came by phone, WhatsApp or at the door.':'Changes save straight to the calendar.'}</p>
  <div class="ovl-row">
   <div class="full"><label class="lbl">Apartment</label><select class="ctrl" onchange="mgrSet('unitId',this.value)">${units}</select></div>
   <div><label class="lbl">Check-in</label><input class="ctrl" type="date" value="${m.checkIn}" onchange="mgrSet('checkIn',this.value)"></div>
   <div><label class="lbl">Check-out</label><input class="ctrl" type="date" value="${m.checkOut}" onchange="mgrSet('checkOut',this.value)"></div>
   <div><label class="lbl">Guests</label><input class="ctrl" type="number" min="1" max="20" value="${m.guests}" onchange="mgrSet('guests',this.value)"></div>
   <div><label class="lbl">Nights</label><input class="ctrl" value="${n>0?n:''}" disabled></div>
   <div class="full"><label class="lbl">Guest name</label><input class="ctrl" value="${esc(m.name)}" oninput="state.mgr.name=this.value"></div>
   <div><label class="lbl">Email</label><input class="ctrl" type="email" value="${esc(m.email)}" oninput="state.mgr.email=this.value"></div>
   <div><label class="lbl">Phone</label><input class="ctrl" value="${esc(m.phone)}" oninput="state.mgr.phone=this.value"></div>
   <div><label class="lbl">Came from</label><select class="ctrl" onchange="state.mgr.source=this.value">${srcs}</select></div>
   <div><label class="lbl">Status</label><select class="ctrl" onchange="state.mgr.status=this.value">${sts}</select></div>
   <div class="full"><label class="lbl">Total (${CUR}) — priced from your rate list, change it if you agreed something else</label>
     <input class="ctrl" type="number" step="1" value="${m.total}" oninput="state.mgr.total=this.value"></div>
  </div>
  ${state.mgrErr?`<div class="ovl-err">${esc(state.mgrErr)}</div>`:''}
  <div class="ovl-act">
   <button class="btn" onclick="mgrSave()" ${state.mgrBusy?'disabled':''}>${state.mgrBusy?'Saving…':(m.mode==='new'?'Create booking':'Save changes')}</button>
   <button class="btn btn-ghost" onclick="mgrClose()">Close</button>
   ${m.mode==='edit'&&m.status!=='cancelled'?`<button class="btn btn-ghost" style="margin-inline-start:auto;color:var(--danger-dark)" onclick="mgrCancel()">Cancel booking</button>`:''}
  </div>
 </div></div>`
}

 const revenue=conf.reduce((s,b)=>s+b.total,0);

 return `<div class="chat-fab" onclick="toggleChat()">✕</div>
 <div class="chat-panel">
  <div class="chat-head"><span><strong>${L('Vienna Stay Assistant','Vienna Stay Assistent')}</strong><br><span style="font-size:11px;opacity:.85;font-family:-apple-system,sans-serif">${L('Usually replies instantly','Antwortet meist sofort')}</span></span><span onclick="toggleChat()" style="cursor:pointer;font-size:18px">✕</span></div>
  <div class="chat-body" id="chatBody">${msgs}${sugg}</div>
  <div class="chat-input"><input id="chatInp" placeholder="${L('Ask a question…','Frage stellen…')}" onkeydown="if(event.key==='Enter')sendChat()"><button onclick="sendChat()">➤</button></div>
 </div>`;
}
function toggleChat(){state.chatOpen=!state.chatOpen;if(state.chatOpen&&state.chatMsgs.length===0)state.chatMsgs.push({role:'bot',text:L("Hi! 👋 I'm the Vienna Stay assistant. Ask me about prices, availability, group stays, booking, or anything about the apartments.","Hallo! 👋 Ich bin der Vienna-Stay-Assistent. Fragen Sie mich zu Preisen, Verfügbarkeit, Gruppen, Buchung oder den Apartments.")});render();scrollChat()}
function pushBot(q){const ans=assistantAnswer(q);state.chatMsgs.push({role:'bot',text:'__typing__'});render();scrollChat();const delay=550+Math.min(1400,q.length*30)+Math.random()*400;setTimeout(function(){for(var i=state.chatMsgs.length-1;i>=0;i--){if(state.chatMsgs[i].text==='__typing__'){state.chatMsgs.splice(i,1);break}}state.chatMsgs.push({role:'bot',text:ans});render();scrollChat()},delay)}
function chatAsk(q){state.chatMsgs.push({role:'user',text:q});render();scrollChat();pushBot(q)}
function sendChat(){const el=document.getElementById('chatInp');const q=(el&&el.value||'').trim();if(!q)return;state.chatMsgs.push({role:'user',text:q});render();scrollChat();pushBot(q)}
function scrollChat(){setTimeout(function(){const b=document.getElementById('chatBody');if(b)b.scrollTop=b.scrollHeight;const i=document.getElementById('chatInp');if(i)i.focus()},30)}
function initMap(){try{
 const el=document.getElementById('locmap');if(!el)return;
 if(!window.L){el.innerHTML='<div class="muted" style="padding:20px">'+L('Map loading…','Karte lädt…')+'</div>';return}
 if(el._init)return;el._init=true;
 const M=window.L;
 const COORDS={u1:[48.2140,16.3590],u2:[48.1910,16.3810],u3:[48.1985,16.3630],u4:[48.1850,16.3200]};
 const pts=UNITS.map(function(u){var la=u.lat,ln=u.lng;if((!la||!ln)&&COORDS[u.id]){la=COORDS[u.id][0];ln=COORDS[u.id][1]}return{u:u,la:la,ln:ln}}).filter(function(p){return p.la&&p.ln});
 const map=M.map('locmap',{scrollWheelZoom:false}).setView([48.2082,16.3738],12);
 M.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
 const bounds=[];
 pts.forEach(function(p){M.marker([p.la,p.ln]).addTo(map).bindPopup('<b>'+esc(p.u.name)+'</b><br>'+esc(p.u.address||''));bounds.push([p.la,p.ln])});
 if(bounds.length){map.fitBounds(bounds,{padding:[40,40],maxZoom:14})}
}catch(e){}}

/* TIMER */
function startTimer(){tick=setInterval(()=>{const s=remainSecs(),el=document.getElementById('tmr');if(s<=0){render();return}if(el){el.textContent='⏳ '+L('Held for','Reserviert für')+' '+mmss(s);el.className='timer'+(s<120?' warn':'')}},1000)}

document.addEventListener('click',function(){if(state.pickerOpen){state.pickerOpen=null;render()}});
state.screen='adminlogin';
render();loadAll();
</script>
